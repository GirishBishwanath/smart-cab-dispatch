name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: landing
            path: landing
          - app: guest-portal
            path: guest-portal
          - app: driver-portal
            path: driver-portal
          - app: admin-portal
            path: admin-portal

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate server syntax
        run: node --check src/server.js

      - name: Run tests
        run: npm test

  backend-integration:
    name: backend-integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start MongoDB replica set
        working-directory: .
        run: |
          docker run -d --name smart-cab-mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          until docker exec smart-cab-mongo mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1; do
            sleep 1
          done
          docker exec smart-cab-mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]})"
          until docker exec smart-cab-mongo mongosh --quiet --eval "rs.status().ok" | grep -q 1; do
            sleep 1
          done

      - name: Run integration tests
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/smart_cab_dispatch_test?replicaSet=rs0
          JWT_SECRET: integration-test-secret
        run: npm run test:integration

      - name: Stop MongoDB
        if: always()
        working-directory: .
        run: docker rm -f smart-cab-mongo

  backend-docker:
    name: backend-docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --pull -t smart-cab-dispatch-backend:ci ./backend
